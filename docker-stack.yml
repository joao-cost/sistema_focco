# Stack para o Swarm da HDSwarmPrincipal — usa o Traefik JÁ EXISTENTE nessa
# VPS (rede externa HDSwarmNet, certresolver "letsencryptresolver"), então
# este stack NÃO sobe um Traefik próprio — só se conecta ao que já roda.
#
# A imagem é publicada automaticamente no Docker Hub a cada push na main
# (ver .github/workflows/docker-publish.yml) — a VPS só puxa a tag, não
# builda nada localmente.
#
# Pré-requisitos:
#   - Rede externa HDSwarmNet já criada (já está, é usada pelo Portainer/Traefik).
#   - Domínio DOMAIN com um registro A apontando para o IP da VPS.
#   - Secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN configurados no GitHub
#     (Settings > Secrets and variables > Actions do repositório).
#
# Configuração (arquivo .env.prod na mesma pasta — ver .env.prod.example):
#   DB_PASSWORD, AUTH_SECRET, DOMAIN, DOCKERHUB_IMAGE
#
# Deploy (primeira vez — puxa a imagem do Docker Hub automaticamente):
#   export $(grep -v '^#' .env.prod | xargs) && \
#   docker stack deploy -c docker-stack.yml focco
#
# Atualizar depois de um novo push (nova imagem já publicada pelo GitHub Actions):
#   docker service update --image $DOCKERHUB_IMAGE --force focco_app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: focco
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env.prod}
      POSTGRES_DB: sistema_focco
    volumes:
      - focco_db_data:/var/lib/postgresql/data
    networks:
      - focco_internal
    deploy:
      placement:
        constraints: [node.role == manager]

  app:
    image: ${DOCKERHUB_IMAGE:?defina DOCKERHUB_IMAGE no .env.prod}
    environment:
      DATABASE_URL: postgresql://focco:${DB_PASSWORD:?defina DB_PASSWORD no .env.prod}@db:5432/sistema_focco
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env.prod}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://${DOMAIN:?defina DOMAIN no .env.prod}
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - HDSwarmNet
      - focco_internal
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.focco.rule=Host(`${DOMAIN}`)
        - traefik.http.services.focco.loadbalancer.server.port=3000
        - traefik.http.routers.focco.tls.certresolver=letsencryptresolver
        - traefik.http.routers.focco.service=focco
        - traefik.docker.network=HDSwarmNet
        - traefik.http.routers.focco.entrypoints=websecure

networks:
  HDSwarmNet:
    external: true
    attachable: true
    name: HDSwarmNet
  focco_internal:
    driver: overlay

volumes:
  focco_db_data:
