# stack: focco

services:
  # banco de dados
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: focco
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: sistema_focco
    volumes:
      - focco_db_data:/var/lib/postgresql/data
    networks:
      - focco_internal
    deploy:
      placement:
        constraints: [node.role == manager]

  # aplicação
  app:
    image: ${DOCKERHUB_IMAGE:?defina DOCKERHUB_IMAGE}
    environment:
      DATABASE_URL: postgresql://focco:${DB_PASSWORD:?defina DB_PASSWORD}@db:5432/sistema_focco
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://${DOMAIN:?defina DOMAIN}
      NEXT_TELEMETRY_DISABLED: "1"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    networks:
      - HDSwarmNet
      - focco_internal
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.focco.rule=Host(`${DOMAIN}`)
        - traefik.http.services.focco.loadbalancer.server.port=3000
        - traefik.http.routers.focco.tls.certresolver=letsencryptresolver
        - traefik.http.routers.focco.service=focco
        - traefik.docker.network=HDSwarmNet
        - traefik.http.routers.focco.entrypoints=websecure
        - traefik.http.routers.focco-public.rule=Host(`${PUBLIC_DOMAIN:-nao-configurado.invalid}`)
        - traefik.http.routers.focco-public.tls.certresolver=letsencryptresolver
        - traefik.http.routers.focco-public.service=focco
        - traefik.http.routers.focco-public.entrypoints=websecure

networks:
  HDSwarmNet:
    external: true
    attachable: true
    name: HDSwarmNet
  focco_internal:
    driver: overlay

volumes:
  focco_db_data:
