name: Build e publica imagem Docker

# Builda a imagem a cada push na main e publica no Docker Hub — assim a VPS
# só precisa dar "docker service update --image ... --force" (ou
# "docker stack deploy" na primeira vez) pra puxar a versão mais nova, sem
# precisar buildar nada localmente.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema_focco:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema_focco:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
